name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          pytest

  docker:
    name: Validate Docker Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::847460071971:role/DeployForge-GitHubActions-Role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t deployforge:test .

      - name: Start Docker container
        run: |
          docker run -d --name deployforge-test -p 8000:8000 deployforge:test

      - name: Test application health endpoint
        run: |
          # Wait briefly for application to initialize
          sleep 5

          # Verify that the /health endpoint returns HTTP 200
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          echo "Health check HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Health check failed: expected HTTP 200, got $HTTP_STATUS"
            echo "Container logs:"
            docker logs deployforge-test
            exit 1
          fi

          echo "Health check passed: $(curl -s http://localhost:8000/health)"

      - name: Tag Docker image for ECR
        run: |
          docker tag deployforge:test \
            847460071971.dkr.ecr.ap-south-1.amazonaws.com/deployforge-dev:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
            847460071971.dkr.ecr.ap-south-1.amazonaws.com/deployforge-dev:latest

      - name: Deploy to Amazon ECS
        run: |
          aws ecs update-service \
            --cluster deployforge-dev-cluster \
            --service deployforge-dev-service \
            --force-new-deployment \
            --region ap-south-1


      - name: Clean up test container
        if: always()
        run: |
          docker stop deployforge-test || true
          docker rm deployforge-test || true
